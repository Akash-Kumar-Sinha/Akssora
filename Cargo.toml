[workspace]
members = ["crates/akssora-cli","crates/akssora-core", "crates/akssora-guest-agent", "crates/session"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = {version= "0.1.20" , features = ["full"]}
http-body-util =    {version = "0.1", features = ["full"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
bytes = "1.12.1"
tokio-vsock = "0.7.2"
uuid = { version="1.24.1", features = ["v4"] }
pty-process = { version="0.5.3", features = ["async"]}
