[workspace]
members = [
    "crates/akssora-cli",
    "crates/akssora-core",
    "crates/akssora-api",
    "crates/akssora-scheduler",
    "crates/akssora-guest-agent",
    "crates/session",
    "crates/akssora-e2e-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = { version = "0.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1.12.1"
tokio-vsock = "0.7.2"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
pty-process = { version = "0.5.3", features = ["async"] }
nix = { version = "0.29", features = ["fs", "process", "term", "signal", "mount", "hostname"] }
sha2 = "0.10"
sled = "0.34"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1"
aes-gcm = "0.10"
rand = "0.8"
toml = "0.8"
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "migrate"] }
governor = "0.8"
tower = "0.5"
tower-layer = "0.3"
tower-service = "0.3"
